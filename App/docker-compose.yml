services:

  frontend:
    build: ./frontend
    env_file:
      - ./frontend/.env

    ports:
      - "${FRONTEND_PORT}:3000"

    depends_on:
      - backend

  backend:
    build: ./backend
    env_file:
      - ./backend/.env

    ports:
      - "${BACKEND_PORT}:8000"

    environment:
      NEO4J_URI: ${NEO4J_URI}
      NEO4J_USER: ${NEO4J_USER}
      NEO4J_PASSWORD: ${NEO4J_PASSWORD}

    depends_on:
      neo4j:
        condition: service_healthy

    volumes:
    - ./backend/data:/app/data


  neo4j:
    image: neo4j:5
    ports:
      - "7474:7474"
      - "7687:7687"

    environment:
      NEO4J_AUTH: neo4j/password
      NEO4J_PLUGINS: '["apoc"]'

    volumes:
      - neo4j_data:/data
      - ./neo4j_data:/import
      - ./import:/scripts

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "cypher-shell -u neo4j -p password 'RETURN 1' >/dev/null 2>&1"
        ]
      interval: 10s
      timeout: 10s
      retries: 30
      start_period: 60s

  importer:
    image: neo4j:5

    depends_on:
      neo4j:
        condition: service_healthy

    volumes:
      - ./import:/scripts
      - ./neo4j_data:/import
      - ./init:/init

    entrypoint:
      - /bin/bash
      - /init/import.sh

volumes:
  neo4j_data: